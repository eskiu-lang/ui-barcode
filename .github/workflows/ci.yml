name: CI

on:
  # once per change: main (main and the tags only get commits that already ran here)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        # Straight from the release, as install.sh does (the site can refuse CI runners).
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: Tests
        run: eskiuc test
      - name: API reference is current
        run: python3 -I tools/gen_api.py --check
      - name: Tests (-O2)
        run: eskiuc test -O2
      - name: The example type-checks
        run: cd examples/scan && eskiuc fetch && eskiuc src/main.esk --test-typechecker

  # The native desktop hosts: tools/ci_desktop.sh builds the example for GTK 4 and Win32.
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: GTK 4
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev > /dev/null
      - name: Desktop
        run: tools/ci_desktop.sh linux

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu and llvm-mingw
        run: |
          mkdir -p "$HOME/.eskiu"
          curl -fsSL -o eskiuc.zip https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-windows-x86_64.zip
          unzip -q eskiuc.zip -d "$HOME/.eskiu"
          cygpath -w "$HOME/.eskiu/bin" >> $GITHUB_PATH
          v=20261020
          curl -fsSL -o tc.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip"
          echo "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd  tc.zip" | sha256sum -c -
          unzip -q tc.zip -d "$HOME"
          cygpath -w "$HOME/llvm-mingw-$v-ucrt-x86_64/bin" >> $GITHUB_PATH
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
      - name: Desktop
        run: tools/ci_desktop.sh windows
